# CI — Rust checks + differential conformance against the Python reference.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust build / lint / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  python-bridge:
    name: M11 Python bridge (maturin wheel + DoD suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install maturin + pytest
        run: |
          pip install maturin pytest
      - name: Create virtualenv for maturin
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest
      - name: Build and install the bridge wheel
        working-directory: crates/helen-python-bridge
        run: |
          source ../../.venv/bin/activate
          maturin develop --release
      - name: M11 DoD suite (Python → Helen round-trip)
        working-directory: crates/helen-python-bridge
        run: |
          source ../../.venv/bin/activate
          python -m pytest tests/test_bridge_python.py -q

  conformance:
    name: Conformance vs Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Python reference interpreter (public repo)
        uses: actions/checkout@v4
        with:
          repository: hahalee000000/helen
          path: python-helen
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reference interpreter + test tooling
        run: |
          pip install -e ./python-helen
          pip install pytest
      - name: Conformance contract tests
        env:
          HELEN_SRC: ${{ github.workspace }}/python-helen
        run: python -m pytest tests/conformance/ -q
      - name: Parity sweep on release build (M14)
        env:
          HELEN_SRC: ${{ github.workspace }}/python-helen
        continue-on-error: true
        run: |
          cargo build --release
          # Tier A differential + display byte-identical + error parity.
          if [[ -f scripts/diff-tier-a.sh ]]; then
            bash scripts/diff-tier-a.sh
          fi
          python3 tests/conformance/check_golden.py tests/programs/display --suite display
          python3 scripts/gen-error-diff.py --all
