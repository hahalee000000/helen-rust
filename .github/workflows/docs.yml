# CI — Generate and publish API documentation
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-docs-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml') }}
      
      - name: Generate documentation
        run: |
          cargo doc --workspace --no-deps --document-private-items
          
          # Create index.html redirect
          cat > target/doc/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=helen_interpreter/index.html">
            <title>Helen Rust - API Documentation</title>
          </head>
          <body>
            <p>Redirecting to <a href="helen_interpreter/index.html">helen_interpreter</a>...</p>
            <h2>Available Crates</h2>
            <ul>
              <li><a href="helen_core/index.html">helen_core</a> - Core types and AST</li>
              <li><a href="helen_parser/index.html">helen_parser</a> - Parser and lexer</li>
              <li><a href="helen_semantic/index.html">helen_semantic</a> - Semantic analysis</li>
              <li><a href="helen_interpreter/index.html">helen_interpreter</a> - Interpreter and stdlib</li>
              <li><a href="helen_runtime/index.html">helen_runtime</a> - Runtime services</li>
              <li><a href="helen_lsp/index.html">helen_lsp</a> - Language server</li>
              <li><a href="helen_ffi/index.html">helen_ffi</a> - FFI bindings</li>
            </ul>
          </body>
          </html>
          EOF
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
