# Release pipeline — M14 Task 14.3.
#
# On tag push (vX.Y.Z):
#   1. Build release binaries for linux (x86_64 + aarch64), macOS, Windows.
#   2. Upload binaries to the GitHub Release (helen-<os>-<arch>.tar.gz, matching
#      scripts/install.sh expectations).
#   3. Publish the `helen-rust` CLI crate to crates.io.
#   4. Build + publish the `helen-rust` Python bridge wheel to PyPI.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: helen-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: helen-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: helen-darwin-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: helen-darwin-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: helen-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --package helen-rust --target ${{ matrix.target }}
      - name: Package (tar.gz)
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/helen"
          [[ "${{ matrix.os }}" == "windows-latest" ]] && BIN="$BIN.exe"
          mkdir -p dist
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C "$(dirname "$BIN")" "$(basename "$BIN")"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.tar.gz

  publish-crate:
    name: Publish helen-rust to crates.io
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish CLI crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --package helen-rust --allow-dirty

  publish-wheel:
    name: Publish helen-rust wheel to PyPI
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install maturin
        run: pip install maturin
      - name: Build wheel
        working-directory: crates/helen-python-bridge
        run: maturin build --release
      - name: Publish to PyPI
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        working-directory: crates/helen-python-bridge
        run: maturin publish --skip-existing

  attach-release:
    name: Attach binaries to GitHub Release
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.tar.gz
