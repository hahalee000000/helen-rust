[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "helen-rust"
version = "0.1.4"
description = "Helen language Rust runtime — Python bridge (import and call Helen agents from Python)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
features = ["extension-module"]
# Compiled extension lives at helen_rust._core; the pure-Python shim package
# (python/helen_rust/) provides the public API + import hook.
python-source = "python"
module-name = "helen_rust._core"
