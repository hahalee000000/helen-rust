[package]
name = "helen-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Helen language Rust reimplementation — installable CLI package (binary: helen)"

[[bin]]
name = "helen"
path = "src/main.rs"

[dependencies]
helen-core = { path = "../helen-core" }
helen-parser = { path = "../helen-parser" }
helen-semantic = { path = "../helen-semantic" }
helen-interpreter = { path = "../helen-interpreter" }
helen-runtime = { path = "../helen-runtime" }
helen-lsp = { path = "../helen-lsp" }
helen-ffi = { path = "../helen-ffi", optional = true }
serde_json.workspace = true
chrono.workspace = true

[features]
default = []
python-ffi = ["helen-ffi/python-ffi"]
