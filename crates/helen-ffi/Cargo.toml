[package]
name = "helen-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Helen language Rust reimplementation — helen-ffi (M10 Python FFI, Helen → Python)"

[features]
default = []
# Enables the Python FFI runtime (embeds CPython via PyO3). Off by default so
# pure-Rust builds need no Python headers.
python-ffi = ["dep:pyo3"]
# maturin-only: prevents the cdylib from linking libpython (manylinux
# compliance). Enabled by [tool.maturin] features in pyproject.toml; never
# enabled for `cargo test` (tests embed Python via auto-initialize).
extension-module = ["pyo3/extension-module"]

[dependencies]
helen-interpreter = { version = "0.1.0", path = "../helen-interpreter" }
helen-runtime = { version = "0.1.0", path = "../helen-runtime" }
helen-core = { version = "0.1.0", path = "../helen-core" }
num-bigint.workspace = true
indexmap.workspace = true
serde_json.workspace = true
pyo3 = { version = "0.23", features = ["auto-initialize"], optional = true }

[dev-dependencies]
helen-parser = { path = "../helen-parser" }
