# helen-rust — Rust reimplementation of the Helen programming language
# Workspace root. All phases (M0–M14) build crates under crates/.
[workspace]
resolver = "2"
members = [
  "crates/helen-core",
  "crates/helen-parser",
  "crates/helen-semantic",
  "crates/helen-interpreter",
  "crates/helen-stdlib",
  "crates/helen-runtime",
  "crates/helen-rust",   # installable crates.io package "helen-rust" (binary: helen)
  "crates/helen-lsp",
  "crates/helen-ffi",             # PyO3, feature-gated; M10
  "crates/helen-python-bridge",   # maturin cdylib; M11
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["helen-rust contributors"]
repository = "https://github.com/hahalee000000/helen-rust"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
num-bigint = "0.4"
num-traits = "0.2"
ryu = "1"  # shortest round-trip float formatting (Python-repr parity)
thiserror = "2"
anyhow = "1"
regex = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
proptest = "1"
rstest = "0.18"
hmac = "0.12"
uuid = { version = "1", features = ["v4", "v5"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
digest = "0.10"
csv = "1"

pyo3 = { version = "0.23", features = ["abi3-py39"] }  # unused until M10/M11
